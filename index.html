<!DOCTYPE html>
<html class="h-full">
<head>
    <title>FroggoCutter 🐸⚔️</title>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?">
    <link rel="manifest" href="site.webmanifest">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="script.js"></script>
</head>
<body class="h-full flex flex-col min-h-screen bg-gray-100 text-gray-900">
    <div class="container mx-auto px-4 py-6 flex flex-col h-full">
        <!-- Área principal para la imagen -->
        <div class="flex-1 relative flex items-center justify-center mb-4" style="min-height: 70vh;">
            <input type="file" id="imageInput" accept="image/*" class="hidden">
            
            <div id="dropZone" class="absolute inset-0 border-2 border-dashed border-gray-300 rounded-2xl flex items-center justify-center text-lg text-gray-500 cursor-pointer hover:border-green-500 transition-colors duration-300 z-10 p-4">
                Click here, drag and drop, or Ctrl+V to paste an image
            </div>

            <div id="container" class="absolute inset-0 hidden rounded-2xl flex items-center justify-center">
                <img id="imageToCrop" class="hidden max-w-full max-h-full">
            </div>
        </div>

        <!-- Controles inferiores -->
        <div class="mt-auto">
            <!-- Controles en una sola fila -->
            <div class="flex flex-wrap justify-between items-center gap-4 mb-4">
                <!-- Panel de controles de formato: cambiado bg-white a bg-gray-800, añadido text-white, w-fit, flex-grow-0 -->
                <div class="bg-gray-800 dark:bg-gray-800 text-white p-3 rounded-2xl shadow-md flex flex-wrap gap-3 items-center w-fit flex-grow-0">
                    <div class="font-medium">Format:</div>
                    <select id="outputFormat" class="rounded-2xl border border-gray-300 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-green-500 transition-colors duration-300 text-gray-900 dark:text-gray-100 dark:bg-gray-600 dark:border-gray-500">
                        <option value="t_login">t_login</option>
                        <option value="bmp">BMP</option>
                    </select>
                    
                    <div id="BitContainer" class="items-center gap-2">
                        <label class="flex items-center space-x-2 group relative" title="Produces smaller and more compressed images">
                            <input type="checkbox" id="8Bit" class="rounded border-gray-300 text-green-600 focus:ring-green-500">
                            <span>8Bit</span>
                            <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 px-3 py-2 bg-gray-900 text-white text-xs rounded-lg w-48 text-center pointer-events-none z-10">
                                Produces smaller and more compressed images
                            </div>
                        </label>
                        
                        <!-- Checkbox para Noise -->
                        <label class="flex items-center space-x-2 ml-2 hidden" id="noiseCheckboxContainer" title="Adding noise can significantly improve the quality of quantized images">
                            <input type="checkbox" id="addNoise" class="rounded border-gray-300 text-green-600 focus:ring-green-500">
                            <span>Noise</span>
                            <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 px-3 py-2 bg-gray-900 text-white text-xs rounded-lg w-48 text-center pointer-events-none z-10">
                                Adding noise to a quantized image can improve overall quality
                            </div>
                        </label>
                        
                        <div class="relative flex items-center">
                            <select id="paletteMethod" disabled class="border border-gray-300 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-green-500 transition-colors duration-300 text-gray-900 dark:text-gray-100 dark:bg-gray-600 dark:border-gray-500">
                                <option value="medianCut">Median Cut</option>
                                <option value="kmeans">K-Means</option>
                                <option value="neuquant">NeuQuant</option>
                                <option value="popularityQuantization">Popularity Quantization</option>
                                <option value="errorDiffusion">Error Diffusion Dithering</option>
                            </select>
                            
                            <!-- Ícono de información con popup (ahora a la derecha del selector) -->
                            <button id="methodInfoBtn" class="ml-2 text-green-500 focus:outline-none hidden" aria-label="Method information">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2h-1V9a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Control de relación de aspecto (ahora en el centro) -->
                <div class="flex flex-wrap gap-4">
                    <button id="aspectRatio169" class="px-4 py-2 bg-gray-800 text-white rounded-2xl hover:bg-green-600 transition-colors duration-300" title="Best aspect ratio for Ragnarok clients in fullscreen">16:9</button>
                    <button id="aspectRatio43" class="px-4 py-2 bg-gray-800 text-white rounded-2xl hover:bg-green-600 transition-colors duration-300">4:3</button>
                    <button id="aspectRatio11" class="px-4 py-2 bg-gray-800 text-white rounded-2xl hover:bg-green-600 transition-colors duration-300">1:1</button>
                    <button id="aspectRatioFree" class="px-4 py-2 bg-gray-800 text-white rounded-2xl hover:bg-green-600 transition-colors duration-300">Free</button>
                    <button id="reset" class="px-4 py-2 bg-gray-800 text-white rounded-2xl hover:bg-green-600 transition-colors duration-300">Reset</button>
                </div>
            </div>

            <!-- Botón de recorte y descarga (ahora centrado en su propia fila) -->
            <div class="flex justify-center mb-4">
                <button id="cropButton" class="relative px-6 py-3 bg-gray-800 text-white rounded-2xl hover:bg-green-600 transition-colors duration-300">
                    Crop & Download
                </button>
            </div>
        </div>
    </div>

    <!-- Popup para información de métodos de cuantificación -->
    <div id="methodInfoPopup" class="fixed hidden inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg max-w-md w-full text-gray-800 dark:text-white">
            <h3 class="text-xl font-bold mb-4">Quantization Ranking FTW 🐸☝️</h3>
            
            <!-- Headers para Calidad y Velocidad -->
            <div class="flex justify-between items-center mb-3 px-3">
                <div class="font-medium">Method</div>
                <div class="flex justify-end w-full max-w-[200px]">
                    <span class="font-medium text-yellow-500 w-20 text-center">Quality</span>
                    <span class="font-medium text-blue-400 w-20 text-center">Speed</span>
                </div>
            </div>
            <div class="space-y-1">
                <div class="flex justify-between items-center bg-gray-100 dark:bg-gray-700 p-3 rounded">
                    <div class="font-medium">NeuQuant</div>
                    <div class="flex justify-end w-full max-w-[200px]">
                        <span class="text-yellow-500 w-20 text-center">★★★★★</span>
                        <span class="text-blue-400 w-20 text-center">★☆☆☆☆</span>
                    </div>
                </div>
                <div class="flex justify-between items-center p-3 rounded">
                    <div class="font-medium">Median Cut</div>
                    <div class="flex justify-end w-full max-w-[200px]">
                        <span class="text-yellow-500 w-20 text-center">★★★★☆</span>
                        <span class="text-blue-400 w-20 text-center">★★★★★</span>
                    </div>
                </div>
                <div class="flex justify-between items-center bg-gray-100 dark:bg-gray-700 p-3 rounded">
                    <div class="font-medium">K-Means</div>
                    <div class="flex justify-end w-full max-w-[200px]">
                        <span class="text-yellow-500 w-20 text-center">★★★★☆</span>
                        <span class="text-blue-400 w-20 text-center">★★★★★</span>
                    </div>
                </div>
                <div class="flex justify-between items-center p-3 rounded">
                    <div class="font-medium">Popularity Quant.</div>
                    <div class="flex justify-end w-full max-w-[200px]">
                        <span class="text-yellow-500 w-20 text-center">★★☆☆☆</span>
                        <span class="text-blue-400 w-20 text-center">★★★★★</span>
                    </div>
                </div>
                <div class="flex justify-between items-center bg-gray-100 dark:bg-gray-700 p-3 rounded">
                    <div class="font-medium">Error Diffusion</div>
                    <div class="flex justify-end w-full max-w-[200px]">
                        <span class="text-yellow-500 w-20 text-center">★★★☆☆</span>
                        <span class="text-blue-400 w-20 text-center">★★★☆☆</span>
                    </div>
                </div>
            </div>
            <button id="closeInfoPopup" class="mt-6 w-full px-4 py-2 bg-gray-800 text-white rounded-xl hover:bg-green-600 transition-colors duration-300">Close</button>
        </div>
    </div>

    <button id="dark-mode-btn" class="fixed bottom-5 right-8 px-5 py-2.5 bg-gray-800 text-white rounded-2xl hover:bg-green-600 transition-all duration-300 transform hover:scale-105 z-50">
        <span class="btn-text">Dark Mode</span>
    </button>
</body>
</html>
